<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Authentication</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
    }

    .tabs {
      display: flex;
      background: #f5f5f5;
    }

    .tab {
      flex: 1;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
    }

    .tab.active {
      background: white;
      color: #667eea;
    }

    .form-container {
      padding: 40px;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
    }

    .message {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 5px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    .user-info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .user-info h3 {
      color: #667eea;
      margin-bottom: 15px;
    }

    .user-info p {
      margin: 8px 0;
      color: #555;
    }

    .btn-logout {
      background: #dc3545;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-logout:hover {
      background: #c82333;
    }

    .users-list {
      margin-top: 20px;
    }

    .user-card {
      background: white;
      border: 1px solid #e0e0e0;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Auth Forms -->
  <div id="authSection">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <div class="form-container">
      <!-- Login Form -->
      <div id="loginForm" class="form-section active">
        <div id="loginMessage" class="message"></div>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <label for="loginEmail"></label><input type="email" id="loginEmail" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <label for="loginPassword"></label><input type="password" id="loginPassword" required>
          </div>
          <button type="submit">Login</button>
        </form>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="form-section">
        <div id="registerMessage" class="message"></div>
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Full Name</label>
            <label for="registerFullName"></label><input type="text" id="registerFullName" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <label for="registerEmail"></label><input type="email" id="registerEmail" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <label for="registerPassword"></label><input type="password" id="registerPassword" required>
          </div>
          <button type="submit">Register</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard">
    <div class="form-container">
      <div class="user-info">
        <h3>Welcome!</h3>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
        <p><strong>Full Name:</strong> <span id="userFullName"></span></p>
        <p><strong>Token expires in:</strong> <span id="tokenExpiry"></span> seconds</p>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>

      <div>
        <h3>All Users</h3>
        <button onclick="loadAllUsers()" style="margin: 10px 0; padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">Load Users</button>
        <div id="usersList" class="users-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:8080';

  // Switch between login and register tabs
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

    if (tab === 'login') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('registerForm').classList.add('active');
    }
  }

  // Show message
  function showMessage(elementId, message, isError = false) {
    const msgElement = document.getElementById(elementId);
    msgElement.textContent = message;
    msgElement.className = 'message ' + (isError ? 'error' : 'success');
    msgElement.style.display = 'block';

    setTimeout(() => {
      msgElement.style.display = 'none';
    }, 5000);
  }

  // Handle Login
  async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const response = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      if (response.ok) {
        const data = await response.json();
        localStorage.setItem('token', data.token);
        localStorage.setItem('expiresIn', data.expiresIn);
        showMessage('loginMessage', 'Login successful!');
        setTimeout(() => {
          loadDashboard();
        }, 1000);
      } else {
        const error = await response.text();
        showMessage('loginMessage', 'Login failed: ' + error, true);
      }
    } catch (error) {
      showMessage('loginMessage', 'Error: ' + error.message, true);
    }
  }

  // Handle Register
  async function handleRegister(event) {
    event.preventDefault();

    const fullName = document.getElementById('registerFullName').value;
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;

    try {
      const response = await fetch(`${API_URL}/auth/signup`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ fullName, email, password })
      });

      if (response.ok) {
        showMessage('registerMessage', 'Registration successful! Please login.');
        setTimeout(() => {
          switchTab('login');
          document.getElementById('loginEmail').value = email;
        }, 1500);
      } else {
        const error = await response.text();
        showMessage('registerMessage', 'Registration failed: ' + error, true);
      }
    } catch (error) {
      showMessage('registerMessage', 'Error: ' + error.message, true);
    }
  }

  // Load Dashboard
  async function loadDashboard() {
    const token = localStorage.getItem('token');

    if (!token) {
      return;
    }

    try {
      const response = await fetch(`${API_URL}/users/me`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (response.ok) {
        const user = await response.json();
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userFullName').textContent = user.fullName || 'N/A';
        document.getElementById('tokenExpiry').textContent = Math.floor(localStorage.getItem('expiresIn') / 1000);

        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
      } else {
        logout();
      }
    } catch (error) {
      console.error('Error loading dashboard:', error);
      logout();
    }
  }

  // Load All Users
  async function loadAllUsers() {
    const token = localStorage.getItem('token');

    try {
      const response = await fetch(`${API_URL}/users/`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (response.ok) {
        const users = await response.json();
        const usersList = document.getElementById('usersList');

        usersList.innerHTML = users.map(user => `
                        <div class="user-card">
                            <p><strong>Name:</strong> ${user.fullName || 'N/A'}</p>
                            <p><strong>Email:</strong> ${user.email}</p>
                        </div>
                    `).join('');
      } else {
        alert('Failed to load users');
      }
    } catch (error) {
      console.error('Error loading users:', error);
    }
  }

  // Logout
  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('expiresIn');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('authSection').style.display = 'block';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
  }

  // Check if user is already logged in
  window.onload = function() {
    const token = localStorage.getItem('token');
    if (token) {
      loadDashboard();
    }
  };
</script>
</body>
</html>
