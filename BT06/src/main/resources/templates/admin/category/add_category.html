<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Category</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { width: 600px; margin: 0 auto; }
        .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .actions { display: flex; gap: 10px; margin-top: 12px; }
        a.btn, button.btn {
            padding: 6px 12px; border-radius: 4px; text-decoration: none; color: white; border: none; cursor: pointer;
        }
        .save { background: #4CAF50; }
        .cancel { background: #9e9e9e; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align:center;">Thêm Category</h2>

    <div class="card">
        <form th:action="@{/admin/category/add}" th:object="${category}" method="post">
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <!-- cateName -->
            <div class="form-group">
                <label for="cateName">Tên Category <span style="color:#f44336">*</span></label>
                <input id="cateName" type="text" th:field="*{cate_name}" placeholder="VD: Đồ uống" required />
            </div>

            <!-- icons (chọn file, chỉ lấy tên) -->
            <div class="form-group">
                <label for="iconFile">Chọn Icon (chỉ lưu tên file)</label>
                <input id="iconFile" type="file" accept="image/*" />
                <!-- hidden bind trực tiếp vào thuộc tính icons -->
                <input type="hidden" th:field="*{icons}" id="iconsHidden" />
            </div>

            <div class="actions">
                <button type="submit" class="btn save">Lưu</button>
                <a th:href="@{/admin/category}" class="btn cancel">Hủy</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Lấy tên file và gán vào hidden th:field="*{icons}"
    const fileInput = document.getElementById('iconFile');
    const hiddenIcons = document.getElementById('iconsHidden');

    fileInput.addEventListener('change', function () {
        if (this.files && this.files.length > 0) {
            hiddenIcons.value = this.files[0].name; // chỉ tên file
        } else {
            hiddenIcons.value = '';
        }
    });
</script>
</body>
</html>
