<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Category</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
        a.btn {
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            color: white;
        }
        .edit {
            background: #4CAF50;
        }
        .delete {
            background: #f44336;
        }
        .add {
            background: #2196F3;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Danh sách Category</h2>

<div style="text-align:center;">
    <a class="btn add" th:href="@{/admin/category/add}">+ Thêm Category</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên Category</th>
        <th>Icons</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cate : ${categories}">
        <td th:text="${cate.cate_id}"></td>
        <td th:text="${cate.cate_name}"></td>
        <td>
            <img th:src="${cate.icons}" alt="icon" style="width:30px;height:30px;"/>
        </td>
        <td>
            <a class="btn edit"
               th:href="@{/admin/category/edit(cate_id=${cate.cate_id})}">Sửa</a>
            <form th:action="@{/admin/category/delete(cate_id=${cate.cate_id})}" method="post"
                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa user này không?');">
                <button type="submit" class="delete">Xóa</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
