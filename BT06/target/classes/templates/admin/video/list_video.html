<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Video</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 90%; margin: auto; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f2f2f2; }
        a.btn { padding: 6px 10px; border-radius: 4px; text-decoration: none; color: #fff; }
        .add { background: #2196F3; display: inline-block; margin-bottom: 15px; }
        .edit { background: #4CAF50; }
        .delete { background: #f44336; }
    </style>
</head>
<body>

<h2 style="text-align:center;">Danh sách Video</h2>

<div style="text-align:center;">
    <a class="btn add" th:href="@{/admin/video/add}">+ Thêm Video</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Danh mục</th>
        <th>Tiêu đề</th>
        <th>Mô tả</th>
        <th>URL</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="video : ${videos}">
        <td th:text="${video.video_id}"></td>
        <td th:text="${video.category.cate_name}"></td>
        <td th:text="${video.title}"></td>
        <td th:text="${video.description}"></td>
        <td>
            <a th:href="${video.url}" target="_blank" th:text="${video.url}"></a>
        </td>
        <td>
            <a class="btn edit" th:href="@{/admin/video/edit(id=${video.video_id})}">Sửa</a>
            <form th:action="@{/admin/video/delete}" method="post" style="display:inline;"
                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa video này không?');">
                <input type="hidden" name="id" th:value="${video.video_id}"/>
                <input type="hidden" th:if="${_csrf!=null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit" class="delete">Xóa</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
