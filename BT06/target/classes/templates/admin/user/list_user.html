<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách User</title>
    <style>
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #333;
        }
        th, td {
            padding: 8px 12px;
            text-align: center;
        }
        th {
            background: #4CAF50;
            color: white;
        }
        a {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        .edit {
            background: #2196F3;
            color: white;
        }
        .delete {
            background: #f44336;
            color: white;
        }
        .add {
            display: inline-block;
            margin: 20px auto;
            background: #4CAF50;
            color: white;
        }
        .container {
            width: 80%;
            margin: auto;
            text-align: right;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Danh sách User</h2>

<div class="container">
    <a th:href="@{/admin/user/add}" class="add">+ Thêm User</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên đăng nhập</th>
        <th>Họ tên</th>
        <th>Email</th>
        <th>Số điện thoại</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.userName}"></td>
        <td th:text="${user.fullName}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.phone}"></td>
        <td>
            <a th:href="@{'/admin/user/edit'(id=${user.id})}" class="edit">Chỉnh sửa</a>
            <form th:action="@{'/admin/user/delete'(id=${user.id})}" method="post"
                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa user này không?');">
                <button type="submit" class="delete">Xóa</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
