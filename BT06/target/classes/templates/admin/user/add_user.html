<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            width: 400px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            background: #f9f9f9;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        button:hover {
            background: #45a049;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Thêm User</h2>
    <form th:action="@{/admin/user/add}" method="post" th:object="${user}">
        <label>Email:</label>
        <input type="email" th:field="*{email}" required>

        <label>Username:</label>
        <input type="text" th:field="*{userName}" required>

        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" required>

        <label>Password:</label>
        <input type="password" th:field="*{passWord}" required>

        <label>Avatar (URL):</label>
        <input type="text" th:field="*{avatar}">

        <label>Phone:</label>
        <input type="text" th:field="*{phone}">

        <button type="submit">Lưu User</button>
    </form>

    <a href="/admin/user" class="back">⬅ Quay lại danh sách</a>
</div>

</body>
</html>
