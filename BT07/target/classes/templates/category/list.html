<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<main layout:fragment="content">
    <h2>Danh sách Category</h2>

    <form method="get" th:action="@{/category}">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm..."/>
        <button type="submit">Tìm</button>
    </form>

    <a th:href="@{/category/add}">+ Thêm mới</a>
    <table border="1" cellpadding="5" cellspacing="0">
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Hành động</th>
        </tr>
        <tr th:each="c : ${categories}">
            <td th:text="${c.cate_id}"></td>
            <td th:text="${c.cateName}"></td>
            <td>
                <a th:href="@{/category/edit(id=${c.cate_id})}">Sửa</a>
                <form th:action="@{/category/delete}" method="post" style="display:inline"
                      onsubmit="return confirm('Bạn có chắc muốn xóa?')">
                    <input type="hidden" name="id" th:value="${c.cate_id}" />
                    <button type="submit">Xóa</button>
                </form>
            </td>
        </tr>
    </table>

    <div>
        <span th:each="i : ${#numbers.sequence(0, totalPages-1)}">
            <a th:href="@{|/category?page=${i}&keyword=${keyword}|}"
               th:text="${i+1}"
               th:classappend="${i==currentPage} ? 'active'"></a>
        </span>
    </div>
</main>
</body>
</html>
