<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<main layout:fragment="content">
    <h2 th:text="${category.cateId != null} ? 'Chỉnh sửa Category' : 'Thêm mới Category'"></h2>

    <form th:action="@{/admin/category/add}" method="post" th:object="${category}">
        <input type="hidden" th:field="*{cateId}">

        <label>Tên:</label>
        <input type="text" th:field="*{cateName}" required/>

        <label>Icon:</label>
        <input type="file" id="iconFile" accept="image/*" onchange="setFileName()" />
        <input type="hidden" th:field="*{icons}" id="iconsField"/>

        <button type="submit">Lưu</button>
    </form>

    <script>
        function setFileName() {
            const fileInput = document.getElementById("iconFile");
            const hiddenInput = document.getElementById("iconsField");

            if (fileInput.files.length > 0) {
                hiddenInput.value = fileInput.files[0].name;
            }
        }
    </script>
</main>
</body>
</html>
