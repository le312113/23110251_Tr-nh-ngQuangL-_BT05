<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Category CRUD</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</head>
<body>
<h1>Category CRUD 23110251</h1>

<!-- Form thêm -->
<h3>Thêm Category</h3>
<input type="text" id="cateName" placeholder="Category Name">
<input type="file" id="cateIconFile" accept="image/*">
<button id="addBtn">Add</button>

<h3>Danh sách Category</h3>
<ul id="categoryList"></ul>

<!-- Form chỉnh sửa -->
<div id="editForm" style="display:none; margin-top:20px;">
  <h3>Chỉnh sửa Category</h3>
  <input type="hidden" id="editId">
  <input type="text" id="editName" placeholder="Category Name">
  <input type="file" id="editIconFile" accept="image/*">
  <input type="hidden" id="editIcon">
  <button id="updateBtn">Update</button>
  <button id="cancelBtn">Cancel</button>
</div>

<script>
  // Load Category list
  function loadCategories() {
    $.get("/api/categories", function(data) {
      $("#categoryList").empty();
      data.forEach(c => {
        $("#categoryList").append(
                `<li>
               ${c.cateName} (${c.icon ? c.icon : "No icon"})
               <button onclick="showEdit(${c.cateId}, '${c.cateName}', '${c.icon || ""}')">Sửa</button>
               <button onclick="deleteCategory(${c.cateId})">Xóa</button>
             </li>`
        );
      });
    });
  }

  // Khi chọn file (Add)
  $("#cateIconFile").change(function() {
    let fileName = this.files[0] ? this.files[0].name : "";
    $("#cateIcon").val(fileName);
  });

  // Khi chọn file (Edit)
  $("#editIconFile").change(function() {
    let fileName = this.files[0] ? this.files[0].name : "";
    $("#editIcon").val(fileName);
  });

  $("#addBtn").click(function () {
    let formData = new FormData();
    formData.append("cateName", $("#cateName").val());
    if ($("#cateIconFile")[0].files[0]) {
      formData.append("icon", $("#cateIconFile")[0].files[0]);
    }

    $.ajax({
      url: "/api/categories",
      type: "POST",
      data: formData,
      processData: false,
      contentType: false,
      success: function (res) {
        console.log("Thêm OK:", res);
        alert("Thêm Category thành công!");
        loadCategories();
        $("#cateName").val("");
        $("#cateIconFile").val("");
      },
      error: function (xhr) {
        console.error("Error:", xhr.responseText);
        alert("Thêm Category thất bại!");
      }
    });
  });


  // Xóa Category
  function deleteCategory(id) {
    $.ajax({
      url: "/api/categories/" + id,
      type: "DELETE",
      success: function() {
        loadCategories();
      }
    });
  }

  // Hiển thị form sửa
  function showEdit(id, name, icon) {
    $("#editId").val(id);
    $("#editName").val(name);
    $("#editIcon").val(icon);
    $("#editForm").show();
  }

  $("#updateBtn").click(function () {
    let id = $("#editId").val();
    let formData = new FormData();
    formData.append("cateName", $("#editName").val());

    if ($("#editIconFile")[0].files[0]) {
      formData.append("icon", $("#editIconFile")[0].files[0]);
    }

    $.ajax({
      url: "/api/categories/" + id,
      type: "PUT",
      data: formData,
      processData: false,
      contentType: false,
      success: function (res) {
        console.log("Update OK:", res);
        alert("Cập nhật Category thành công!");
        loadCategories();
        $("#editForm").hide();
      },
      error: function (xhr) {
        console.error("Error:", xhr.responseText);
        alert("Cập nhật Category thất bại!");
      }
    });
  });


  // Cancel edit
  $("#cancelBtn").click(function() {
    $("#editForm").hide();
  });

  // Load khi mở trang
  $(document).ready(function() {
    loadCategories();
  });
</script>
</body>
</html>
