<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product List</title>
</head>
<body>
<h1>Products</h1>
<ul id="product-list"></ul>

<script>
  // TUYỆT ĐỐI không đặt 'query' ở headers!
  fetch('/graphql', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json' // chỉ cần header này
    },
    body: JSON.stringify({
      query: `query {
        products(orderByPriceAsc: true) {
          id
          title
          price
        }
      }`,
      variables: {}
    })
  })
          .then(res => res.json())
          .then(({ data, errors }) => {
            if (errors) {
              console.error(errors);
              alert('GraphQL error: ' + (errors[0]?.message || 'unknown'));
              return;
            }
            const ul = document.getElementById('product-list');
            ul.innerHTML = '';
            (data?.products || []).forEach(p => {
              const li = document.createElement('li');
              li.textContent = `${p.title} - ${p.price}`;
              ul.appendChild(li);
            });
          })
          .catch(err => {
            console.error(err);
            alert('Network error: ' + err.message);
          });
</script>
</body>
</html>
